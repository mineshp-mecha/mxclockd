[package]
name = "clockd"
version = "0.1.0"
edition = "2021"
description = "Background daemon for alarms and timers"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "5"
futures-util = "0.3"
nix = { version = "0.29", features = ["time", "inotify"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time", "process", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
